name: HydroSwarm Release

# SUB-3 (submission.txt SS19.1): build and publish one multiarch (amd64 +
# arm64) image tag on a version release/tag, plus the runtime source zip
# and release manifest. Deliberately does NOT publish from arbitrary
# feature-branch pushes -- only version tags (`v*`) or an explicit manual
# dispatch, per submission.txt "Do not publish from arbitrary feature
# branch pushes".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release tag, e.g. "v0.1.0-hackathon" (defaults to the pushed tag).'
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hydroswarm

jobs:
  verify-frozen-bundle:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            echo "value=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The frozen V4 release bundle is committed directly (not via LFS --
      # see .gitattributes), so `actions/checkout` already has real bytes.
      # Verify hashes against the bundle's own manifest before building
      # anything into an image, so a corrupted/edited bundle fails the
      # release before publishing rather than after.
      - name: Verify frozen bundle hashes
        run: |
          python -m pip install --quiet -e .
          python -c "
          import json, hashlib, sys
          from pathlib import Path
          bundle = Path('models/hydrocore-v4-release')
          manifest = json.loads((bundle / 'artifact-manifest.json').read_text())
          for name, expected in manifest['files'].items():
              actual = hashlib.sha256((bundle / name).read_bytes()).hexdigest()
              if actual != expected:
                  print(f'HASH MISMATCH: {name}: expected {expected}, got {actual}', file=sys.stderr)
                  sys.exit(1)
          print('all frozen bundle hashes verified OK')
          "

  build-and-push:
    needs: verify-frozen-bundle
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation for linux/arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multiarch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.verify-frozen-bundle.outputs.release_version }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: true
          sbom: true

  container-self-test:
    needs: [verify-frozen-bundle, build-and-push]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Set up QEMU (cross-arch emulation for linux/arm64)
        uses: docker/setup-qemu-action@v3

      # SUB-3 acceptance criterion: "amd64 image boots; arm64 image
      # builds/smokes; one tag resolves both architectures." SUB-12.1 #21:
      # --strict requires trained assets ready, a genuinely FITTED
      # calibration (not merely loadable), the reference-demo artifact
      # present, the frontend built, and zero resource warnings -- inside
      # the actual pushed image, not a rebuilt copy -- for both platforms.
      - name: Pull and self-test (${{ matrix.platform }})
        run: |
          docker pull --platform ${{ matrix.platform }} "${{ env.IMAGE_NAME }}:${{ needs.verify-frozen-bundle.outputs.release_version }}"
          docker run --rm --platform ${{ matrix.platform }} \
            "${{ env.IMAGE_NAME }}:${{ needs.verify-frozen-bundle.outputs.release_version }}" \
            hydroswarm self-test --strict > self-test-${{ strategy.job-index }}.json
          python3 -c "
          import json, sys
          report = json.load(open('self-test-${{ strategy.job-index }}.json'))
          assert report['ok'] is True, report.get('strict_failures', report)
          assert report['trained_assets']['model_sha256'], 'missing model hash'
          print('container strict self-test OK for ${{ matrix.platform }}')
          "

  release-artifacts:
    needs: [verify-frozen-bundle, build-and-push, container-self-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + build frontend
        run: |
          python -m pip install --quiet -e .
          cd frontend && npm ci && npm run build

      - name: Build RELEASE_MANIFEST.json
        run: |
          python scripts/build_release_manifest.py \
            --release-version "${{ needs.verify-frozen-bundle.outputs.release_version }}" \
            --container-image "${{ env.IMAGE_NAME }}:${{ needs.verify-frozen-bundle.outputs.release_version }}" \
            --container-digest "${{ needs.build-and-push.outputs.digest }}"

      - name: Build runtime source/asset zip
        run: |
          python scripts/build_release_bundle.py \
            --release-version "${{ needs.verify-frozen-bundle.outputs.release_version }}" \
            --out-dir dist

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-frozen-bundle.outputs.release_version }}
          files: |
            dist/*.zip
            RELEASE_MANIFEST.json
