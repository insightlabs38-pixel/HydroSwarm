name: HydroSwarm Release

# SUB-3 (submission.txt SS19.1): build and publish one multiarch (amd64 +
# arm64) image tag on a version release/tag, plus the runtime source zip
# and release manifest. Deliberately does NOT publish from arbitrary
# feature-branch pushes -- only version tags (`v*`).
#
# P0 fix (v0.2.0 release preflight): the previous revision of this workflow
# pushed the FINAL version tag and `latest` in the same step that built the
# image, *before* the post-push amd64/arm64 strict container-self-test ran
# -- meaning a broken image could exist under a public, final tag for as
# long as it took the self-test job to fail. That revision separated
# "build and test" from "publish"; this revision additionally replaces the
# single QEMU-emulated `linux/amd64,linux/arm64` combined build with two
# NATIVE per-architecture builds, because that QEMU build was observed to
# stall for 90+ minutes at the frontend Node stage's `npm ci` under arm64
# emulation (npm's native bindings/syscall volume are notoriously slow
# under QEMU). Current flow:
#
#   verify-frozen-bundle
#   -> build-candidate-amd64   (runs-on: ubuntu-latest, linux/amd64, NATIVE --
#   -> build-candidate-arm64      runs-on: ubuntu-24.04-arm, linux/arm64, NATIVE;
#                                  no QEMU anywhere in this workflow any more.
#                                  Each pushes its image by DIGEST ONLY --
#                                  push-by-digest=true, no tag -- a temporary,
#                                  immutable, unnamed candidate identity)
#   -> container-self-test-amd64  (needs build-candidate-amd64; runs-on:
#   -> container-self-test-arm64      ubuntu-latest / ubuntu-24.04-arm to match;
#                                      pulls the exact per-arch DIGEST -- not a
#                                      tag -- natively, no QEMU, and runs
#                                      `self-test --strict`)
#   -> combine-candidate       (needs both self-tests to have passed; combines
#                               -- never rebuilds -- the two already-tested
#                               per-arch digests into one multiarch manifest
#                               tagged `release-candidate-<sha>` via
#                               `docker buildx imagetools create`, then
#                               verifies the resulting manifest list contains
#                               exactly linux/amd64 + linux/arm64, each
#                               pointing at the exact digest that was tested)
#   -> promote-release          (tag-push only: retag -- never rebuild -- the
#                               SAME tested combined digest as the final
#                               version and `latest`)
#   -> release-artifacts        (build/verify RELEASE_MANIFEST.json + the
#                               runtime zip against the tested digest;
#                               create the GitHub Release only on a real
#                               tag push)
#
# `workflow_dispatch` deliberately has no `release_version` input and never
# runs `promote-release` or creates a GitHub Release -- it is a NON-PUBLISHING
# preflight run of the exact same build+test+combine flow (Option A from the
# v0.2.0 preflight task: a tag push is the only publishing trigger, and a
# manual run from `main` -- where `GITHUB_REF_NAME` is `main`, not a version
# -- can never be interpreted as a legitimate release version because it
# never reaches the promotion/publish jobs at all). The only artifacts a
# `workflow_dispatch` run publishes anywhere are digest-only per-arch pushes
# and the disposable `release-candidate-<sha>` multiarch tag, neither of
# which is ever promoted to a final tag unless a real `vX.Y.Z` tag triggered
# the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hydroswarm

jobs:
  verify-frozen-bundle:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.value }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      # Only a real `push` (tag) event may ever resolve to a publishable
      # release version, and even then it must match `vX.Y.Z` exactly --
      # `tags: ["v*"]` above is a glob, not a format guarantee, so a
      # malformed tag (e.g. "v0.2" or "vfoo") is rejected here rather than
      # silently flowing into a GHCR tag / GitHub Release name.
      # `workflow_dispatch` always resolves to a clearly non-version
      # "preflight-<sha>" label used only for self-test/manifest labeling;
      # it is never used to publish anything.
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME}"
            if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag '$version' does not match the required vX.Y.Z format; refusing to publish." >&2
              exit 1
            fi
            echo "value=$version" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=preflight-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The frozen V5 release bundle is committed directly (not via LFS --
      # see .gitattributes), so `actions/checkout` already has real bytes.
      # Verify hashes against the bundle's own manifest before building
      # anything into an image, so a corrupted/edited bundle fails the
      # release before publishing rather than after. This never falls back
      # to (or even inspects) the historical V4 bundle.
      - name: Verify frozen V5 bundle hashes
        run: |
          python -m pip install --quiet -e .
          python -c "
          import json, hashlib, sys
          from pathlib import Path
          bundle = Path('models/hydrocore-v5-release')
          manifest = json.loads((bundle / 'runtime_manifest.json').read_text())
          for name, expected in manifest['files'].items():
              actual = hashlib.sha256((bundle / name).read_bytes()).hexdigest()
              if actual != expected:
                  print(f'HASH MISMATCH: {name}: expected {expected}, got {actual}', file=sys.stderr)
                  sys.exit(1)
          print('all frozen V5 bundle hashes verified OK')
          "

      - name: Run release-preflight test gates
        run: |
          python -m pip install --quiet -e ".[dev]"
          python -m ruff check src tests
          python -m pytest tests/unit -q -m "not real_simulation"

  # Native linux/amd64 build -- no QEMU. Pushed by DIGEST ONLY (no tag): a
  # temporary, immutable, unnamed candidate identity, never a final tag or
  # `latest`.
  build-candidate-amd64:
    needs: verify-frozen-bundle
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom explicitly DISABLED (not merely omitted -- recent
      # BuildKit/buildx defaults generate a minimal provenance attestation
      # even when these inputs are never set): an attested push-by-digest
      # build wraps its output in an "attestation index" (the real image
      # manifest + an unrelated provenance/sbom manifest under a synthetic
      # unknown/unknown "platform"), so `steps.build.outputs.digest` would
      # be that WRAPPING index's digest, not the plain per-platform image
      # manifest's -- and combine-candidate's
      # `docker buildx imagetools create` would recursively flatten it,
      # producing three manifests (amd64, arm64, and a stray
      # unknown/unknown entry) instead of exactly two, with digests that
      # didn't even match this job's own reported output. Confirmed twice
      # by real failed preflight runs (first omitting these inputs, which
      # buildx still defaulted to attesting; then explicitly disabling
      # them here). A plain (non-attested) single-platform build's digest
      # is unambiguous and stable, which combine-candidate's
      # exact-two-platforms check below depends on.
      - name: Build and push linux/amd64 candidate by digest (native, no QEMU)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

  # Native linux/arm64 build on a genuine arm64 runner -- no QEMU. Pushed by
  # DIGEST ONLY (no tag), same as the amd64 leg above.
  build-candidate-arm64:
    needs: verify-frozen-bundle
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # See build-candidate-amd64's comment: provenance/sbom explicitly
      # disabled so this job's digest output is the plain, unambiguous
      # per-platform image manifest digest, not a wrapping attestation
      # index.
      - name: Build and push linux/arm64 candidate by digest (native, no QEMU)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

  # SUB-3 acceptance criterion: "amd64 image boots; arm64 image
  # builds/smokes; one tag resolves both architectures." SUB-12.1 #21:
  # --strict requires trained assets ready, a genuinely FITTED calibration
  # (not merely loadable), the reference-demo artifact present, the
  # frontend built, and zero resource warnings. Pulled by immutable
  # DIGEST, not a tag: this is the exact same artifact combine-candidate
  # will later fold into the multiarch manifest, byte for byte. Runs
  # natively on a matching-architecture runner -- no QEMU, no
  # `--platform` flag needed since the digest already names one specific
  # single-arch image.
  container-self-test-amd64:
    needs: [verify-frozen-bundle, build-candidate-amd64]
    runs-on: ubuntu-latest
    steps:
      - name: Pull and self-test (linux/amd64, native) -- exact candidate digest
        run: |
          image_ref="${{ env.IMAGE_NAME }}@${{ needs.build-candidate-amd64.outputs.digest }}"
          docker pull "$image_ref"
          docker run --rm "$image_ref" hydroswarm self-test --strict > self-test.json
          python3 -c "
          import json, sys
          FROZEN_MODEL_SHA256 = 'de2b3f56243a1933d1d7c5957cd74a29fade119f7d104ce7f1500b3dd7b6d2a5'
          FROZEN_ARCHITECTURE_VERSION = 'hydroswarm-v5-release-v1'
          report = json.load(open('self-test.json'))
          assert report['ok'] is True, report.get('strict_failures', report)
          trained_assets = report['trained_assets']
          assert trained_assets['model_sha256'] == FROZEN_MODEL_SHA256, trained_assets
          assert trained_assets['architecture_version'] == FROZEN_ARCHITECTURE_VERSION, trained_assets
          assert trained_assets['calibration_status'] == 'FITTED', trained_assets
          print('container strict self-test OK for linux/amd64 (native):', trained_assets['model_sha256'])
          "

  container-self-test-arm64:
    needs: [verify-frozen-bundle, build-candidate-arm64]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Pull and self-test (linux/arm64, native) -- exact candidate digest
        run: |
          image_ref="${{ env.IMAGE_NAME }}@${{ needs.build-candidate-arm64.outputs.digest }}"
          docker pull "$image_ref"
          docker run --rm "$image_ref" hydroswarm self-test --strict > self-test.json
          python3 -c "
          import json, sys
          FROZEN_MODEL_SHA256 = 'de2b3f56243a1933d1d7c5957cd74a29fade119f7d104ce7f1500b3dd7b6d2a5'
          FROZEN_ARCHITECTURE_VERSION = 'hydroswarm-v5-release-v1'
          report = json.load(open('self-test.json'))
          assert report['ok'] is True, report.get('strict_failures', report)
          trained_assets = report['trained_assets']
          assert trained_assets['model_sha256'] == FROZEN_MODEL_SHA256, trained_assets
          assert trained_assets['architecture_version'] == FROZEN_ARCHITECTURE_VERSION, trained_assets
          assert trained_assets['calibration_status'] == 'FITTED', trained_assets
          print('container strict self-test OK for linux/arm64 (native):', trained_assets['model_sha256'])
          "

  # Combines -- never rebuilds -- the two already-tested per-arch digests
  # into one multiarch manifest, then verifies the result contains exactly
  # those two platforms pointing at exactly those two tested digests. This
  # is a registry-metadata operation (`docker buildx imagetools create`),
  # not an image build, so it needs no QEMU either.
  combine-candidate:
    needs:
      [
        verify-frozen-bundle,
        build-candidate-amd64,
        build-candidate-arm64,
        container-self-test-amd64,
        container-self-test-arm64,
      ]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.combine.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine the two tested per-arch digests into one multiarch candidate manifest (no rebuild)
        id: combine
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:release-candidate-${{ github.sha }}" \
            "${{ env.IMAGE_NAME }}@${{ needs.build-candidate-amd64.outputs.digest }}" \
            "${{ env.IMAGE_NAME }}@${{ needs.build-candidate-arm64.outputs.digest }}"
          # The default (non --format) text output's own "Digest:" line is
          # the documented, stable way to read this back.
          digest=$(docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:release-candidate-${{ github.sha }}" | awk '/^Digest:/{print $2; exit}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify the combined manifest contains exactly the two tested per-arch digests
        run: |
          docker buildx imagetools inspect --raw "${{ env.IMAGE_NAME }}:release-candidate-${{ github.sha }}" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          platforms = {
              f\"{m['platform']['os']}/{m['platform']['architecture']}\": m['digest']
              for m in data['manifests']
              if 'platform' in m
          }
          expected = {
              'linux/amd64': '${{ needs.build-candidate-amd64.outputs.digest }}',
              'linux/arm64': '${{ needs.build-candidate-arm64.outputs.digest }}',
          }
          assert platforms == expected, (platforms, expected)
          print('combined candidate manifest verified: exactly', sorted(platforms), 'each pointing at its own tested digest')
          "

  # Tag-push (real release) only. Never runs for workflow_dispatch --
  # `needs.verify-frozen-bundle.outputs.is_release` is only 'true' for a
  # push event that resolved a valid `vX.Y.Z` tag above. Retags the exact
  # combined digest that already passed both per-arch container-self-tests;
  # does NOT rebuild, so there is no way for the published tag to point at
  # an image that was never actually tested.
  promote-release:
    needs: [verify-frozen-bundle, combine-candidate]
    if: needs.verify-frozen-bundle.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the exact tested combined digest to the final release tag and latest
        run: |
          source_ref="${{ env.IMAGE_NAME }}@${{ needs.combine-candidate.outputs.digest }}"
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:${{ needs.verify-frozen-bundle.outputs.release_version }}" \
            --tag "${{ env.IMAGE_NAME }}:latest" \
            "$source_ref"

      - name: Verify both promoted tags resolve to the exact tested combined digest
        run: |
          expected="${{ needs.combine-candidate.outputs.digest }}"
          for tag in "${{ needs.verify-frozen-bundle.outputs.release_version }}" latest; do
            resolved=$(docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${tag}" | awk '/^Digest:/{print $2; exit}')
            if [ "$resolved" != "$expected" ]; then
              echo "::error::Promoted tag '${tag}' resolves to ${resolved}, not the tested combined candidate digest ${expected}" >&2
              exit 1
            fi
            echo "promoted tag '${tag}' verified to point at the exact tested combined digest: $resolved"
          done

  # Runs for BOTH event types: this is also the CI-enforced, non-publishing
  # release-manifest/ZIP dry run (v0.2.0 preflight task sections 9-10).
  # Only the final "Create GitHub Release" step is gated to a real tag push.
  release-artifacts:
    needs: [verify-frozen-bundle, combine-candidate, promote-release]
    if: "always() && needs.combine-candidate.result == 'success' && (needs.promote-release.result == 'success' || needs.promote-release.result == 'skipped')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + build frontend
        run: |
          python -m pip install --quiet -e .
          cd frontend && npm ci && npm run build

      # The container identity this manifest/ZIP describes is always the
      # SAME combined digest container-self-test-{amd64,arm64} already
      # verified -- for a real release it is that digest under its
      # promoted final tag; for a non-publishing preflight run it is that
      # digest under its disposable candidate tag. Never a second,
      # unvalidated image.
      - name: Resolve tested container identity for this manifest
        id: identity
        shell: bash
        run: |
          if [ "${{ needs.verify-frozen-bundle.outputs.is_release }}" = "true" ]; then
            echo "image=${{ env.IMAGE_NAME }}:${{ needs.verify-frozen-bundle.outputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.IMAGE_NAME }}:release-candidate-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "digest=${{ needs.combine-candidate.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Build RELEASE_MANIFEST.json
        run: |
          python scripts/build_release_manifest.py \
            --release-version "${{ needs.verify-frozen-bundle.outputs.release_version }}" \
            --container-image "${{ steps.identity.outputs.image }}" \
            --container-digest "${{ steps.identity.outputs.digest }}"

      - name: Build runtime source/asset zip
        run: |
          python scripts/build_release_bundle.py \
            --release-version "${{ needs.verify-frozen-bundle.outputs.release_version }}" \
            --out-dir dist

      - name: Independently verify ZIP checksums and frozen V5 identity
        run: |
          python3 -c "
          import hashlib, json, zipfile
          from pathlib import Path

          FROZEN_MODEL_SHA256 = 'de2b3f56243a1933d1d7c5957cd74a29fade119f7d104ce7f1500b3dd7b6d2a5'
          FROZEN_RUNTIME_MANIFEST_SHA256 = 'f3fb08642738128f020c50e20e6b68c417bf80703f7ef6bc8f42db2aa41f8d34'

          zip_path, = Path('dist').glob('*.zip')
          with zipfile.ZipFile(zip_path) as archive:
              sha256sums = archive.read('SHA256SUMS').decode('utf-8')
              expected = dict(line.split('  ', 1)[::-1] for line in sha256sums.strip().splitlines())
              for name in archive.namelist():
                  if name == 'SHA256SUMS':
                      continue
                  actual = hashlib.sha256(archive.read(name)).hexdigest()
                  assert expected[name] == actual, f'checksum mismatch for {name}'

              model_bytes = archive.read('models/hydrocore-v5-release/model.safetensors')
              manifest_bytes = archive.read('models/hydrocore-v5-release/runtime_manifest.json')
              assert hashlib.sha256(model_bytes).hexdigest() == FROZEN_MODEL_SHA256
              assert hashlib.sha256(manifest_bytes).hexdigest() == FROZEN_RUNTIME_MANIFEST_SHA256
              assert not any(n.startswith('models/hydrocore-v4-release/') for n in archive.namelist())

          release_manifest = json.loads(Path('RELEASE_MANIFEST.json').read_text())
          assert release_manifest['model_hash'] == FROZEN_MODEL_SHA256
          assert release_manifest['runtime_manifest_sha256'] == FROZEN_RUNTIME_MANIFEST_SHA256
          assert release_manifest['locked_evaluation_status']['state'] == 'M11_6_LOCKED_EVALUATION_PASS'
          print('ZIP checksums and frozen V5 identity independently verified OK')
          "

      - name: Upload manifest/ZIP as workflow artifacts (both release and preflight runs)
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-and-zip-${{ github.sha }}
          path: |
            dist/*.zip
            RELEASE_MANIFEST.json

      # Publish-only step: creates the GitHub Release, and only for a real
      # `vX.Y.Z` tag push. A workflow_dispatch preflight run never reaches
      # this step.
      - name: Create GitHub Release
        if: needs.verify-frozen-bundle.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-frozen-bundle.outputs.release_version }}
          files: |
            dist/*.zip
            RELEASE_MANIFEST.json
