name: HydroSwarm CI

on:
  push:
    # core-issues3.txt Phase 17: CI must run on the development branch,
    # not only main -- agent/** covers this pre-freeze work
    # (agent/gcp-multitopology-v3) and any future agent branch without
    # needing a change here each time one is created.
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Targeted Git-LFS hydration, not `actions/checkout`'s `lfs: true`:
      # this repo carries substantially more LFS data (full training
      # corpora, preserved checkpoints) than the test suite needs, and
      # `lfs: true` would download all of it on both matrix runners for
      # every run. Pull only the committed tensor directories the real
      # (non-locked-test) Python test suite actually reads -- audited by
      # grepping tests/ for every data/learning-v2/**/*.safetensors path a
      # test references; see scripts/verify_lfs_test_fixtures.py's
      # REQUIRED_TENSOR_DIRS for the exact, single source of truth for
      # this list (kept identical to the --include patterns below by
      # construction, not by convention alone).
      - name: Git LFS -- hydrate required test fixture paths only
        run: |
          git lfs install --local
          git lfs pull --include="data/learning-v2/cycle-b2/tensors-normalized/validation/**,data/learning-v2/cycle-b2-control-v2/tensors-normalized/train/**,data/learning-v2/cycle-b2-control-v2/tensors-normalized/validation/**,data/learning-v2/cycle-b2-ood-extension/tensors-normalized/**"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Git LFS -- verify hydration (fails closed with a clear message)
        run: uv run --no-project python scripts/verify_lfs_test_fixtures.py
      - name: Install locked environment
        run: uv sync --all-extras --dev
      - name: Package build and editable installation
        run: uv build
      - name: Compile
        run: uv run python -m compileall -q src
      - name: Lint
        run: uv run ruff check src tests
      - name: Type-check
        run: uv run pyright
      - name: Scientific and application tests with coverage
        run: uv run pytest --cov=hydroswarm --cov-report=term-missing --cov-report=xml
      - name: Offline self-test
        run: uv run hydroswarm self-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

