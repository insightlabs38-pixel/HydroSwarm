name: HydroSwarm CI

on:
  push:
    # core-issues3.txt Phase 17: CI must run on the development branch,
    # not only main -- agent/** covers this pre-freeze work
    # (agent/gcp-multitopology-v3) and any future agent branch without
    # needing a change here each time one is created.
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    # Generous, not tight: catches a genuine runaway/hang (e.g. a future
    # regression reintroducing pathological per-call spawn overhead
    # broadly rather than just in the audited full_simulation set) without
    # making ordinary timing variance flaky.
    timeout-minutes: 45
    env:
      # Targeted Git-LFS hydration, not `actions/checkout`'s `lfs: true`:
      # this repo carries substantially more LFS data (full training
      # corpora, preserved checkpoints) than the test suite needs, and
      # `lfs: true` would download all of it on both matrix runners for
      # every run. Pull only the committed tensor directories the real
      # (non-locked-test) Python test suite actually reads -- audited by
      # grepping tests/ for every data/learning-v2/**/*.safetensors path a
      # test references; see scripts/verify_lfs_test_fixtures.py's
      # REQUIRED_TENSOR_DIRS for the exact, single source of truth for
      # this list (kept identical to the --include pattern below by
      # construction, not by convention alone).
      LFS_REQUIRED_INCLUDE: "data/learning-v2/cycle-b2/tensors-normalized/validation/**,data/learning-v2/cycle-b2-control-v2/tensors-normalized/train/**,data/learning-v2/cycle-b2-control-v2/tensors-normalized/validation/**,data/learning-v2/cycle-b2-ood-extension/tensors-normalized/**"
    steps:
      - uses: actions/checkout@v4

      # `shell: bash` on every Git-LFS step below: Windows' default step
      # shell is PowerShell, but windows-latest ships Git Bash (installed
      # alongside Git for Windows specifically for this purpose) -- using
      # it here means these commands are identical on both matrix OSes
      # instead of needing a second, PowerShell-flavored copy.
      - name: Git LFS -- compute a content-derived cache key for the required fixtures
        id: lfs-cache-key
        shell: bash
        run: |
          git lfs ls-files -l --include="$LFS_REQUIRED_INCLUDE" | sort > /tmp/lfs-required-oids.txt
          echo "hash=$(git hash-object /tmp/lfs-required-oids.txt)" >> "$GITHUB_OUTPUT"
      # Cache is only an optimization: git lfs pull, verify_lfs_test_fixtures.py's
      # pointer-file and manifest-SHA-256 checks below always still run --
      # a cache hit is never trusted as a substitute for verification, and
      # a cache miss/corruption just costs a real re-download, not a wrong
      # test result.
      - name: Git LFS -- restore cached objects for exactly this fixture set
        id: lfs-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs/objects
          key: lfs-objects-${{ steps.lfs-cache-key.outputs.hash }}
      - name: Git LFS -- hydrate required test fixture paths only
        shell: bash
        run: |
          git lfs install --local
          time git lfs pull --include="$LFS_REQUIRED_INCLUDE"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Git LFS -- verify hydration (fails closed with a clear message)
        run: uv run --no-project python scripts/verify_lfs_test_fixtures.py
      # Saved right after hydration+verification succeed, well before the
      # test-running steps below -- an unrelated pytest/lint failure later
      # in the job must not prevent a successfully hydrated+verified cache
      # from being persisted for the next run.
      - name: Git LFS -- save cache (only on a miss; a hit needs no re-save)
        if: steps.lfs-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs/objects
          key: lfs-objects-${{ steps.lfs-cache-key.outputs.hash }}

      - name: Install locked environment
        run: uv sync --all-extras --dev
      - name: Package build and editable installation
        run: uv build
      - name: Compile
        run: uv run python -m compileall -q src
      - name: Lint
        run: uv run ruff check src tests
      - name: Type-check
        run: uv run pyright

      # Ubuntu remains the full, authoritative backend suite: every real
      # WNTR/EPANET scientific test, every training/data integration test,
      # with coverage. Unchanged from before this split.
      - name: Full scientific and application test suite with coverage (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest --cov=hydroswarm --cov-report=term-missing --cov-report=xml --durations=30

      # Windows: broad portability/correctness suite containing ZERO real
      # simulator calls -- excludes every test marked real_simulation (any
      # test that invokes HydraulicSimulator/WNTR/EPANET at least once, not
      # just the >=10-call full_simulation subset; even a handful of real
      # calls is expensive here) and the dedicated smoke file below (run
      # separately for clear reporting, not to avoid it -- it would
      # otherwise also match "not real_simulation" and run twice). A
      # tests/conftest.py runtime hook independently fails the run if any
      # unmarked test is ever found making a real call, so this exclusion
      # is enforced, not merely asserted by this comment. No coverage here
      # -- Ubuntu's full run above is the single authoritative coverage
      # source; a second, partial Windows coverage report would be noise,
      # not signal.
      - name: Broad test suite, zero real simulator calls (Windows)
        if: matrix.os == 'windows-latest'
        run: uv run pytest -m "not real_simulation" --ignore=tests/scientific/test_windows_simulator_smoke.py --durations=30
      # Separate, explicitly-reported step: proves native Windows spawn
      # correctness for real WNTR simulation, real EPANET simulation, real
      # timeout/child termination, real exception propagation, one exact
      # plan-verification path, and one end-to-end API incident workflow
      # -- once, not hundreds of times. No sys.platform faking; on a real
      # windows-latest runner this genuinely exercises "spawn" because
      # HydraulicSimulator._run_with_timeout's own context selection sees
      # a real win32 platform here.
      - name: Real-simulator smoke group (Windows)
        if: matrix.os == 'windows-latest'
        run: uv run pytest tests/scientific/test_windows_simulator_smoke.py -v --durations=10

      - name: Offline self-test
        run: uv run hydroswarm self-test
      # Ubuntu is the only leg that produces coverage.xml (see above).
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  # UI-11.1 §5: separate from frontend-quality above for clearer failure
  # reporting/caching -- a Playwright/visual-regression failure is a
  # different kind of signal than a lint/typecheck/unit-test failure, and
  # mixing them into one job makes both slower to diagnose. Runs on
  # ubuntu-latest specifically because the committed visual baselines
  # (tests/e2e/visual-regression.spec.ts-snapshots/*-chromium-linux.png)
  # are Linux Chromium baselines -- any other OS would fail on font/
  # rendering differences that have nothing to do with a real regression.
  # Never auto-approves/updates screenshots here: no --update-snapshots,
  # so real visual drift fails the job rather than silently passing.
  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright report and failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

