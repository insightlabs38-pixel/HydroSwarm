name: TEMP regenerate Playwright baselines

on:
  push:
    branches: [feature/ui-mission-control-v1]

jobs:
  regen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --update-snapshots || true
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-baselines
          path: frontend/tests/e2e/visual-regression.spec.ts-snapshots/
