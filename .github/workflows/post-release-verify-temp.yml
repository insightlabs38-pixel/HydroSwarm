name: TEMP Post-Release v0.2.0 Verification

# TEMPORARY, workflow_dispatch-only, one-time post-release smoke for the
# v0.2.0 GHCR publication (this sandbox has no local Docker daemon to run
# `docker compose -f docker-compose.release.yml up` itself). Pulls the
# REAL published `ghcr.io/insightlabs38-pixel/hydroswarm:v0.2.0` image via
# the real docker-compose.release.yml (no local build, no source
# checkout used by the running container), hits the real HTTP endpoints,
# and runs the strict self-test inside the real published container. Does
# not push, tag, or modify anything. Intended to be removed immediately
# after this one verification run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull and launch the published v0.2.0 image via docker-compose.release.yml
        run: docker compose -f docker-compose.release.yml up -d

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8765/api/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          python3 -c "
          import json
          health = json.load(open('/tmp/health.json'))
          assert health['status'] == 'ok', health
          assert health['version'] == '0.2.0', health
          print('/api/health OK, version:', health['version'])
          "

      - name: Strict self-test inside the real published container
        run: |
          docker compose -f docker-compose.release.yml exec -T hydroswarm hydroswarm self-test --strict > self-test.json
          python3 -c "
          import json
          FROZEN_MODEL_SHA256 = 'de2b3f56243a1933d1d7c5957cd74a29fade119f7d104ce7f1500b3dd7b6d2a5'
          report = json.load(open('self-test.json'))
          assert report['ok'] is True, report.get('strict_failures', report)
          trained_assets = report['trained_assets']
          assert trained_assets['model_sha256'] == FROZEN_MODEL_SHA256, trained_assets
          assert trained_assets['calibration_status'] == 'FITTED', trained_assets
          print('published-container strict self-test OK:', trained_assets['model_sha256'])
          "

      - name: Reference Incident works
        run: |
          status=$(curl -s -o /tmp/reference-demo.json -w "%{http_code}" http://127.0.0.1:8765/api/reference-demo)
          test "$status" = "200"
          test -s /tmp/reference-demo.json
          echo "GET /api/reference-demo -> 200 ($(wc -c < /tmp/reference-demo.json) bytes)"

      - name: Live Example works (real EPANET water-quality simulation)
        run: |
          status=$(curl -s -o /tmp/live-example.json -w "%{http_code}" http://127.0.0.1:8765/api/live-example-inputs)
          test "$status" = "200"
          python3 -c "
          import json
          data = json.load(open('/tmp/live-example.json'))
          sigs = data['candidate_signatures_mg_l']
          assert sigs, 'no candidate signatures'
          assert any(v > 0.0 for v in sigs.values()), sigs
          print('GET /api/live-example-inputs -> 200, real positive EPANET concentration OK')
          "

      - name: Container logs (always, for diagnosis)
        if: always()
        run: docker compose -f docker-compose.release.yml logs

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.release.yml down -v
