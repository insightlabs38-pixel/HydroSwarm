<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">HydroSwarm offline decision architecture</title>
  <desc id="desc">Evidence flows through hydraulic and neural inference, calibrated uncertainty, sampling and plan generation, WNTR verification, and human approval.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061824"/><stop offset="1" stop-color="#0b2b36"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#54d8e4"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/>
  <text x="120" y="135" fill="#f4fbff" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="700">HydroSwarm</text>
  <text x="120" y="200" fill="#54d8e4" font-family="Inter,Arial,sans-serif" font-size="34">Physics first. Uncertainty acts. Simulation verifies.</text>
  <g fill="#102f3c" stroke="#3274d9" stroke-width="4" filter="url(#shadow)" font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(100 390)"><rect width="240" height="170" rx="22"/><text x="120" y="74" fill="#54d8e4" font-size="25" font-weight="700">EVIDENCE</text><text x="120" y="116" fill="#d7e8ef" font-size="22">Telemetry + samples</text></g>
    <g transform="translate(410 300)"><rect width="270" height="170" rx="22"/><text x="135" y="72" fill="#54d8e4" font-size="25" font-weight="700">PHYSICS</text><text x="135" y="112" fill="#d7e8ef" font-size="21">Graph + signatures</text></g>
    <g transform="translate(410 570)"><rect width="270" height="170" rx="22"/><text x="135" y="72" fill="#54d8e4" font-size="25" font-weight="700">HYDROCORE</text><text x="135" y="112" fill="#d7e8ef" font-size="21">Graph + time + quality</text></g>
    <g transform="translate(760 435)"><rect width="260" height="170" rx="22" stroke="#15c5d8"/><text x="130" y="72" fill="#54d8e4" font-size="25" font-weight="700">FUSION</text><text x="130" y="112" fill="#d7e8ef" font-size="21">Dynamic trust</text></g>
    <g transform="translate(1100 435)"><rect width="270" height="170" rx="22"/><text x="135" y="63" fill="#54d8e4" font-size="25" font-weight="700">UNCERTAINTY</text><text x="135" y="103" fill="#d7e8ef" font-size="20">Conformal + OOD</text><text x="135" y="134" fill="#d7e8ef" font-size="20">Abstain or act</text></g>
    <g transform="translate(1450 300)"><rect width="300" height="170" rx="22"/><text x="150" y="70" fill="#54d8e4" font-size="25" font-weight="700">SCOUT</text><text x="150" y="112" fill="#d7e8ef" font-size="21">Choose evidence</text></g>
    <g transform="translate(1450 570)"><rect width="300" height="170" rx="22"/><text x="150" y="62" fill="#54d8e4" font-size="25" font-weight="700">PLAN + WNTR</text><text x="150" y="102" fill="#d7e8ef" font-size="20">Reject / repair / verify</text><text x="150" y="134" fill="#d7e8ef" font-size="20">Compare no response</text></g>
  </g>
  <g fill="none" stroke="#54d8e4" stroke-width="5" marker-end="url(#arrow)">
    <path d="M340 475L405 395"/><path d="M340 475L405 645"/><path d="M680 385L755 500"/><path d="M680 655L755 545"/><path d="M1020 520L1095 520"/><path d="M1370 500L1445 400"/><path d="M1370 545L1445 645"/>
  </g>
  <path d="M1600 750v90H320v-270" fill="none" stroke="#f0b34d" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#arrow)"/>
  <text x="960" y="875" fill="#f0b34d" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">NEW SAMPLE REVISES THE POSTERIOR</text>
  <rect x="680" y="930" width="560" height="82" rx="41" fill="#d9f4f6"/>
  <text x="960" y="982" fill="#08212d" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">HUMAN APPROVAL REQUIRED - NO CONTROL CONNECTOR</text>
</svg>
