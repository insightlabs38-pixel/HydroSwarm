services:
  hydroswarm:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - hydroswarm-data:/data
    environment:
      HYDROSWARM_DATA_DIR: /data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  hydroswarm-data:
